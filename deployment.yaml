apiVersion: apps/v1
kind: Deployment
metadata:
  name: q1-placement-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: q1-placement-portal
  template:
    metadata:
      labels:
        app: q1-placement-portal
    spec:
      containers:
        - name: q1-placement-portal
          image: raeezsafa9778/q1-placement-portal:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: q1-placement-portal-service
spec:
  type: NodePort
  selector:
    app: q1-placement-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
