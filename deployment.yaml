
apiVersion: apps/v1
kind: Deployment
metadata:
  name: q3-event-management
spec:
  replicas: 3
  selector:
    matchLabels:
      app: q3-event-management
  template:
    metadata:
      labels:
        app: q3-event-management
    spec:
      containers:
        - name: q3-event-management
          image: raeezsafa9778/q3-event-management:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: q3-event-management-service
spec:
  type: NodePort
  selector:
    app: q3-event-management
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30083
