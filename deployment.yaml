apiVersion: apps/v1
kind: Deployment
metadata:
  name: q2-online-bookstore
spec:
  replicas: 3
  selector:
    matchLabels:
      app: q2-online-bookstore
  template:
    metadata:
      labels:
        app: q2-online-bookstore
    spec:
      containers:
        - name: q2-online-bookstore
          image: DOCKERHUB_USERNAME/q2-online-bookstore:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: q2-online-bookstore-service
spec:
  type: NodePort
  selector:
    app: q2-online-bookstore
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082
